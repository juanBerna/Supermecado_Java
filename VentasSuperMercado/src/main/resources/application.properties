spring.application.name=VentasSuperMercado
# ==========================
# Configuraciones de JPA + MySQL
# ==========================
spring.datasource.url=jdbc:h2:mem:superdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasourse.driverClassName=org.h2.Driver
spring.datasource.username=jcbernabe
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.database-platform=org.hibernate.dialect.H@Dialect
server.port=8080

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
